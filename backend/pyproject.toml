[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clintelai-backend"
version = "0.1.0"
description = "ClintelAI - Multilingual, Trusted-Source Healthcare Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ClintelAI Team" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
